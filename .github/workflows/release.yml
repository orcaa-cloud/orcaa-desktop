name: Build & Release Desktop

# Triggers:
# - Push tag "v1.0.0"            -> builds and releases the app
# - Manual dispatch (Actions UI) -> same, from the current ref
#
# ONE app ships. It used to be two — a separate "Orcaa Admin" build pointing at
# admin.orcaa.cloud — but both compiled from the same Rust crate and the same
# window: an admin signs in through the ordinary app and auth hands them to the
# platform console. The second build bought nothing but a second icon, a second
# release channel and a second updater manifest to keep alive, so it is gone.
#
# The release lands on "v1.0.0" as a normal (non-prerelease) release, which is
# what keeps /releases/latest/ — and the landing page's stable download URLs —
# resolving to it.
#
# The build covers ALL THREE platforms:
#   windows-latest -> .msi + .exe (NSIS) + .nsis.zip updater payload
#   macos-latest   -> .dmg + .app.tar.gz updater payload (universal: Intel + Apple Silicon)
#   ubuntu-22.04   -> .deb + .rpm + .AppImage (the AppImage doubles as the updater payload)
# No Mac/Linux hardware required — GitHub's runners do the build, sign and notarize.
#
# Plus a WINDOWS 7 legacy lane (`build-win7`, x64 + x86) that ships alongside:
#   `Orcaa_<v>_x64-win7-setup.exe` / `Orcaa_<v>_x86-win7-setup.exe` (+ .sig),
#   stable names `orcaa-desktop-win7.exe` / `orcaa-desktop-win7-x86.exe`, and
#   its own updater manifest `latest-win7.json`. It is a separate job, not a
#   matrix entry: tauri-action uploads every file in the bundle dir under its
#   own name, and the Win7 NSIS installer is born with the SAME filename as the
#   Windows 10/11 one — it must be renamed before it touches the release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  resolve:
    name: Resolve version from config
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: pick
        shell: bash
        run: |
          set -euo pipefail

          # The version comes from the config, NOT the tag — it is what lands in
          # every artifact filename and in latest.json.
          VERSION=$(jq -r '.version' src-tauri/tauri.business.conf.json)

          # The other three the checklist demands. Checking only the overlay
          # config let package.json drift five patch versions behind unnoticed:
          # nothing consumes it at build time, so nothing ever complained.
          BASE_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          PKG_VERSION=$(jq -r '.version' package.json)
          CARGO_VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)

          for pair in "tauri.conf.json:$BASE_VERSION" "package.json:$PKG_VERSION" "Cargo.toml:$CARGO_VERSION"; do
            file="${pair%%:*}"
            found="${pair#*:}"
            if [[ "$found" != "$VERSION" ]]; then
              echo "::error::$file says $found but tauri.business.conf.json says $VERSION. All four version fields must match."
              exit 1
            fi
          done

          # THE guard. The tag does not set the version; the config does. Tagging
          # v1.0.5 over a config still reading 1.0.10 publishes a release whose
          # manifest advertises 1.0.10 — every client compares that against its own
          # 1.0.10, correctly concludes it is current, and the update never ships.
          # That silently stalled the entire 1.0.x line. Fail loudly instead.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME declares version $TAG_VERSION but the app config says $VERSION. Bump all four version fields (tauri.conf.json, tauri.business.conf.json, Cargo.toml, package.json), then re-tag."
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Resolved VERSION=$VERSION (ref=$GITHUB_REF_NAME)"

  build:
    needs: resolve
    name: Build (${{ matrix.target.label }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false
      # Serialized: jobs write to one shared release, and the macOS runner is
      # billed 10x on private repos — no reason to race them.
      max-parallel: 1
      matrix:
        target:
          - os: windows-latest
            label: windows-x64
            rust_targets: x86_64-pc-windows-msvc
            build_args: "--bundles msi,nsis"
            bundle_dir: src-tauri/target/release/bundle
          - os: macos-latest
            label: macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_args: "--target universal-apple-darwin --bundles app,dmg"
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          # Pinned to 22.04 on purpose: glibc/webkit2gtk on the runner become the FLOOR for
          # every user's distro. Building on ubuntu-latest (24.04) would break Ubuntu 22.04 /
          # Debian 12 users. Bump only when those distros are no longer worth supporting.
          - os: ubuntu-22.04
            label: linux-x64
            rust_targets: x86_64-unknown-linux-gnu
            build_args: "--bundles deb,rpm,appimage"
            bundle_dir: src-tauri/target/release/bundle

    env:
      # Filled in by "Enable Windows signing" when the Azure secrets exist;
      # empty means the extra --config flag simply isn't passed.
      WIN_SIGN_ARGS: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The stable filenames the landing page links to. They never carry the
      # version, so the download URLs on the marketing site survive every release.
      - id: app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"

          {
            echo "tag=v$VERSION"
            echo "product=$(jq -r '.productName' src-tauri/tauri.business.conf.json)"
            echo "stable_exe=orcaa-desktop.exe"
            echo "stable_dmg=orcaa-desktop.dmg"
            echo "stable_appimage=orcaa-desktop.AppImage"
          } >> "$GITHUB_OUTPUT"

      # webkit2gtk = the Linux WebView (WebView2 / WKWebView equivalent);
      # ayatana-appindicator = the tray icon the background mode depends on.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libudev-dev \
            patchelf \
            file

      # Reads the pnpm version from `packageManager` in package.json — no
      # `version:` input here on purpose, so there is one source of truth.
      # Deleting that field (or the lockfile `pnpm install --frozen-lockfile`
      # needs two steps down) fails the build before a single crate compiles.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Resolve every shipped architecture against the committed lockfile.
      # Windows-only checks can miss macOS updater dependencies such as zip.
      - name: Verify locked Rust dependencies
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.target.rust_targets }}
        run: |
          set -euo pipefail
          for target in ${RUST_TARGETS//,/ }; do
            cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target "$target"
          done

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm tauri icon src-tauri/source-icons/business.png --output src-tauri/icons/business

      # Apple code signing + notarization is OPTIONAL. With no Apple secrets configured the
      # macOS build still succeeds and ships an unsigned .dmg (users get a Gatekeeper prompt —
      # see README "macOS Gatekeeper"). Add the secrets and this step turns signing on with
      # zero workflow changes.
      - name: Enable Apple signing (only if secrets are configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          forward() {
            local name="$1" value="$2"
            [[ -z "$value" ]] && return 0
            {
              echo "${name}<<__ORCAA_EOF__"
              echo "$value"
              echo "__ORCAA_EOF__"
            } >> "$GITHUB_ENV"
          }

          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::notice::No APPLE_CERTIFICATE secret — building an UNSIGNED macOS bundle."
            exit 0
          fi

          forward APPLE_CERTIFICATE          "$APPLE_CERTIFICATE"
          forward APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          forward APPLE_SIGNING_IDENTITY     "$APPLE_SIGNING_IDENTITY"
          echo "Apple code signing enabled."

          if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            forward APPLE_ID       "$APPLE_ID"
            forward APPLE_PASSWORD "$APPLE_PASSWORD"
            forward APPLE_TEAM_ID  "$APPLE_TEAM_ID"
            echo "Notarization enabled."
          else
            echo "::warning::Signing without notarization (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID missing)."
          fi

      # Windows Authenticode signing is OPTIONAL, mirroring the Apple block above.
      # Azure Trusted Signing via trusted-signing-cli: with no Azure secrets the
      # build still succeeds and ships an unsigned installer (SmartScreen warning,
      # exactly as before). Configure these six secrets and signing turns on with
      # zero workflow changes:
      #   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET  (app registration)
      #   AZURE_TS_ENDPOINT  (e.g. https://weu.codesigning.azure.net)
      #   AZURE_TS_ACCOUNT   (Trusted Signing account name)
      #   AZURE_TS_PROFILE   (certificate profile name)
      - name: Enable Windows signing (only if secrets are configured)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
        run: |
          set -euo pipefail
          if [[ -z "$AZURE_CLIENT_SECRET" || -z "$AZURE_TS_ENDPOINT" || -z "$AZURE_TS_ACCOUNT" || -z "$AZURE_TS_PROFILE" ]]; then
            echo "::notice::Azure Trusted Signing secrets not configured — building an UNSIGNED Windows installer."
            exit 0
          fi

          cargo install trusted-signing-cli --locked

          # signCommand rides a config overlay so the committed configs stay
          # signing-agnostic; Tauri merges repeated --config flags in order.
          jq -n --arg cmd "trusted-signing-cli -e $AZURE_TS_ENDPOINT -a $AZURE_TS_ACCOUNT -c $AZURE_TS_PROFILE %1" \
            '{bundle: {windows: {signCommand: $cmd}}}' > src-tauri/tauri.windows-sign.conf.json

          echo "WIN_SIGN_ARGS=--config src-tauri/tauri.windows-sign.conf.json" >> "$GITHUB_ENV"
          echo "Windows Authenticode signing enabled (Azure Trusted Signing)."

      - name: Build + sign + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Consumed by trusted-signing-cli when Windows signing is enabled;
          # empty and harmless otherwise.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ steps.app.outputs.tag }}
          releaseName: "${{ steps.app.outputs.product }} ${{ steps.app.outputs.tag }}"
          releaseBody: |
            Auto-generated release built from `${{ github.sha }}`.

            **Windows 10 / 11**
            - **`${{ steps.app.outputs.stable_exe }}`** — stable filename used by the landing site / direct download (NSIS installer wizard)
            - `*_x64-setup.exe` — same NSIS installer, versioned filename
            - `*_x64_en-US.msi` — Windows Installer for IT-managed installs

            **Windows 7 SP1** (legacy build — bundles WebView2 109, the last runtime for Windows 7; larger download, no OS toasts)
            - **`orcaa-desktop-win7.exe`** (64-bit) / **`orcaa-desktop-win7-x86.exe`** (32-bit) — stable filenames used by the landing site
            - `*_x64-win7-setup.exe` / `*_x86-win7-setup.exe` — same installers, versioned filenames; updates come from `latest-win7.json`

            **macOS** (universal — Intel + Apple Silicon, macOS 10.15+)
            - **`${{ steps.app.outputs.stable_dmg }}`** — stable filename used by the landing site / direct download
            - `*_universal.dmg` — same disk image, versioned filename

            **Linux** (x86_64, glibc 2.35+ / Ubuntu 22.04+)
            - **`${{ steps.app.outputs.stable_appimage }}`** — stable filename used by the landing site / direct download (`chmod +x` and run)
            - `*_amd64.deb` — Debian / Ubuntu
            - `*.x86_64.rpm` — Fedora / RHEL / openSUSE

            **Auto-updater** — `*.nsis.zip`, `*.app.tar.gz`, `*.AppImage`, their `*.sig` files and the updater manifest (don't delete).
          releaseDraft: false
          # Never a prerelease: /releases/latest/ is what the landing page's
          # stable download URLs and the updater endpoint both resolve to.
          prerelease: false
          # The updater manifest is composed once, in the `manifest` job below —
          # letting each runner write its own would have the second one clobber
          # the first one's platform entry.
          includeUpdaterJson: false
          args: --config src-tauri/tauri.business.conf.json ${{ env.WIN_SIGN_ARGS }} ${{ matrix.target.build_args }} -- --locked

      - name: Upload stable-name Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SETUP=$(find "${{ matrix.target.bundle_dir }}/nsis" -maxdepth 1 -name "*_x64-setup.exe" | head -1)
          if [[ -z "$SETUP" ]]; then
            echo "::warning::No NSIS setup.exe found at expected path"; exit 0
          fi
          cp "$SETUP" "$RUNNER_TEMP/${{ steps.app.outputs.stable_exe }}"
          gh release upload "${{ steps.app.outputs.tag }}" "$RUNNER_TEMP/${{ steps.app.outputs.stable_exe }}" --clobber
          echo "Uploaded ${{ steps.app.outputs.stable_exe }} (copy of $(basename "$SETUP"))"

      - name: Upload stable-name macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(find "${{ matrix.target.bundle_dir }}/dmg" -maxdepth 1 -name "*.dmg" | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::warning::No .dmg found at expected path"; exit 0
          fi
          cp "$DMG" "$RUNNER_TEMP/${{ steps.app.outputs.stable_dmg }}"
          gh release upload "${{ steps.app.outputs.tag }}" "$RUNNER_TEMP/${{ steps.app.outputs.stable_dmg }}" --clobber
          echo "Uploaded ${{ steps.app.outputs.stable_dmg }} (copy of $(basename "$DMG"))"

      - name: Upload stable-name Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMG=$(find "${{ matrix.target.bundle_dir }}/appimage" -maxdepth 1 -name "*.AppImage" | head -1)
          if [[ -z "$IMG" ]]; then
            echo "::warning::No .AppImage found at expected path"; exit 0
          fi
          cp "$IMG" "$RUNNER_TEMP/${{ steps.app.outputs.stable_appimage }}"
          gh release upload "${{ steps.app.outputs.tag }}" "$RUNNER_TEMP/${{ steps.app.outputs.stable_appimage }}" --clobber
          echo "Uploaded ${{ steps.app.outputs.stable_appimage }} (copy of $(basename "$IMG"))"

  # ---------------------------------------------------------------------------
  # Windows 7 legacy lane
  #
  # Three things separate this from the ordinary Windows build, and all three
  # are forced by the platform, not chosen:
  #   1. Rust ≥ 1.78 binaries need Windows 10. The only supported way to target
  #      Win7 today is the tier-3 `*-win7-windows-msvc` triple, which ships no
  #      prebuilt std — so this is a pinned NIGHTLY with `-Zbuild-std`. The
  #      crate, its dependencies and Cargo.lock are exactly the ones the main
  #      build uses; only the toolchain and target differ.
  #   2. Win7 has no `combase.dll`: Cargo.toml drops the WinRT notification
  #      crates for the `win7` target vendor, and `.cargo/config.toml` adds
  #      `--cfg windows_slim_errors` + a static CRT (see the comments there).
  #   3. WebView2 on Win7 stops at runtime 109 and the evergreen bootstrapper
  #      is unreliable there (TLS 1.2 is often off; it may fetch 110+). The
  #      installer therefore carries Microsoft's own 109 standalone installer
  #      (Update Catalog package, SHA-256 + Authenticode verified; see
  #      src-tauri/webview2-runtime.lock) and runs it when no runtime exists.
  # An import audit (scripts/audit-win7-imports.ps1) then refuses to publish an
  # exe that imports anything Windows 7 does not have — the failure mode is
  # otherwise "the app won't start" on the customer's counter PC.
  # ---------------------------------------------------------------------------
  build-win7:
    needs: [resolve, build]
    # The release object is created by the first `build` matrix job; this lane
    # only needs it to exist, so a failed macOS/Linux build must not skip it.
    if: ${{ !cancelled() }}
    name: Build Windows 7 (${{ matrix.arch }})
    runs-on: windows-latest
    # build-std compiles the standard library too — roughly +10 min over the
    # ordinary Windows build.
    timeout-minutes: 90
    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: x64
            target: x86_64-win7-windows-msvc
            stable_exe: orcaa-desktop-win7.exe
          - arch: x86
            target: i686-win7-windows-msvc
            stable_exe: orcaa-desktop-win7-x86.exe

    env:
      WIN_SIGN_ARGS: ""
      VERSION: ${{ needs.resolve.outputs.version }}
      # Cargo reads the `[unstable]` table from the environment too; keeping
      # this out of .cargo/config.toml is what lets every stable build ignore it.
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
      # Pin the date and bump it on purpose: a tier-3 target has no CI of its
      # own upstream, so a random nightly can break this lane silently.
      RUST_NIGHTLY: nightly-2026-08-20
      WEBVIEW2_RUNTIME_VERSION: "109.0.1518.140"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # No `targets:` input on purpose — rustup has no prebuilt std for the
      # win7 triples; `rust-src` + build-std compiles it instead.
      - name: Setup Rust (pinned nightly + rust-src)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rust-src

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: win7-${{ matrix.arch }}

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm tauri icon src-tauri/source-icons/business.png --output src-tauri/icons/business

      # WebView2 109 is the last runtime that runs on Windows 7, and Microsoft's
      # download page only offers current versions. The one official, still-served
      # copy is the "Microsoft Edge-WebView2 Runtime Version 109 Update" package on
      # the Microsoft Update Catalog — the Evergreen Standalone Installer, hosted on
      # Microsoft's windowsupdate.com CDN. URL + SHA-256 per architecture are pinned
      # in src-tauri/webview2-runtime.lock; the file is refused unless the hash
      # matches AND Microsoft's Authenticode signature verifies. The Win7 overlay
      # ships it as a bundle resource and windows/win7-webview2.nsh runs it at
      # install time when no WebView2 Runtime is present (Microsoft's documented
      # offline-deployment workflow).
      - name: Download WebView2 Runtime ${{ env.WEBVIEW2_RUNTIME_VERSION }} standalone installer (${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          LOCK=src-tauri/webview2-runtime.lock
          read -r EXPECTED URL < <(awk -v a="${{ matrix.arch }}" '$1 == a { print $2, $3 }' "$LOCK")
          if [[ -z "${EXPECTED:-}" || -z "${URL:-}" ]]; then
            echo "::error::$LOCK has no '${{ matrix.arch }}' line (format: <arch> <sha256> <url>)."; exit 1
          fi

          DEST="src-tauri/webview2-runtime/${{ matrix.arch }}/MicrosoftEdgeWebView2RuntimeInstaller.exe"
          mkdir -p "$(dirname "$DEST")"
          curl -sSL --fail --retry 3 -o "$DEST" "$URL"

          ACTUAL=$(sha256sum "$DEST" | cut -d' ' -f1)
          if [[ "${ACTUAL,,}" != "${EXPECTED,,}" ]]; then
            echo "::error::WebView2 installer for ${{ matrix.arch }} does not match the pinned SHA-256 (got $ACTUAL, expected $EXPECTED). Refusing to bundle it."
            exit 1
          fi
          echo "SHA-256 verified: $DEST"

      # The pin proves it is the file we reviewed; this proves Microsoft signed it.
      - name: Verify Microsoft's Authenticode signature on the installer
        shell: pwsh
        run: |
          $exe = "src-tauri/webview2-runtime/${{ matrix.arch }}/MicrosoftEdgeWebView2RuntimeInstaller.exe"
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          Write-Host ("Status: {0}`nSigner: {1}" -f $sig.Status, $sig.SignerCertificate.Subject)
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            Write-Error "The WebView2 installer is not validly signed by Microsoft Corporation. Refusing to bundle it."
          }

      # Same optional Azure Trusted Signing as the main lane.
      - name: Enable Windows signing (only if secrets are configured)
        shell: bash
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
        run: |
          set -euo pipefail
          if [[ -z "$AZURE_CLIENT_SECRET" || -z "$AZURE_TS_ENDPOINT" || -z "$AZURE_TS_ACCOUNT" || -z "$AZURE_TS_PROFILE" ]]; then
            echo "::notice::Azure Trusted Signing secrets not configured — building an UNSIGNED Windows 7 installer."
            exit 0
          fi

          cargo install trusted-signing-cli --locked

          jq -n --arg cmd "trusted-signing-cli -e $AZURE_TS_ENDPOINT -a $AZURE_TS_ACCOUNT -c $AZURE_TS_PROFILE %1" \
            '{bundle: {windows: {signCommand: $cmd}}}' > src-tauri/tauri.windows-sign.conf.json

          echo "WIN_SIGN_ARGS=--config src-tauri/tauri.windows-sign.conf.json" >> "$GITHUB_ENV"
          echo "Windows Authenticode signing enabled (Azure Trusted Signing)."

      # Two steps instead of one `tauri build`: the CLI validates `--target`
      # against `rustup target list`, which never lists tier-3 targets, so it
      # refuses the win7 triples outright. `tauri bundle` has no such check —
      # so cargo compiles, the CLI packages.
      #
      # `TAURI_CONFIG` matters: `tauri build --config` hands cargo the MERGED
      # config through that variable, and `generate_context!()` bakes the
      # updater endpoint, deep-link scheme and icons into the exe at compile
      # time. A raw cargo build without it would embed the bare tauri.conf.json
      # (empty endpoints, no `orcaa://` scheme). jq's `*` is a deep merge where
      # arrays are replaced — the same semantics the CLI uses.
      #
      # `working-directory: src-tauri` is load-bearing: cargo discovers
      # `.cargo/config.toml` from the CURRENT DIRECTORY, not from
      # `--manifest-path`. Run from the repo root and the win7 rustflags
      # (`--cfg windows_slim_errors`, `+crt-static`) silently never apply — the
      # exe then imports the UCRT through `api-ms-win-crt-*` and the audit below
      # rejects it. (That is exactly what happened on the first CI run.)
      - name: Compile (${{ matrix.target }})
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          TAURI_CONFIG="$(jq -cs '.[0] * .[1]' tauri.business.conf.json "tauri.win7-${{ matrix.arch }}.conf.json")"
          export TAURI_CONFIG
          export TAURI_ENV_TARGET_TRIPLE="${{ matrix.target }}"
          # Prove the target-scoped rustflags are in effect before spending 7 minutes compiling.
          cargo config get --format json-value "target.${{ matrix.target }}.rustflags" -Z unstable-options | grep -q "crt-static" \
            || { echo "::error::src-tauri/.cargo/config.toml rustflags for ${{ matrix.target }} were not picked up by cargo."; exit 1; }
          cargo build --locked --release --target "${{ matrix.target }}"

      # NSIS only: the MSI lane is for IT-managed Win10/11 fleets, and the Win7
      # overlay's fixedRuntime block is what makes the installer self-contained.
      # Signs the updater artifact (TAURI_SIGNING_*) and, when the Azure
      # secrets exist, Authenticode-signs through the same overlay as the main
      # lane.
      - name: Bundle (${{ matrix.target }})
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          pnpm tauri bundle --ci \
            --target "${{ matrix.target }}" \
            --config src-tauri/tauri.business.conf.json \
            --config "src-tauri/tauri.win7-${{ matrix.arch }}.conf.json" \
            $WIN_SIGN_ARGS \
            --bundles nsis

      # Refuse to ship an exe Windows 7 cannot load. Prints the full import
      # table for review and fails on any DLL or entry point outside the Win7
      # allowlist (combase.dll, ProcessPrng, api-ms-win-core-*-l1-2-*, …).
      - name: Audit imports against Windows 7
        shell: pwsh
        run: |
          ./scripts/audit-win7-imports.ps1 -Exe "src-tauri/target/${{ matrix.target }}/release/orcaa-desktop.exe"

      # Rename BEFORE upload: the bundler names this installer exactly like the
      # Windows 10/11 one. minisign signs the file bytes, so the .sig stays
      # valid under the new name.
      - name: Upload Windows 7 installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          SRC="src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          SETUP=$(find "$SRC" -maxdepth 1 -name "*_${{ matrix.arch }}-setup.exe" | head -1)
          if [[ -z "$SETUP" ]]; then
            echo "::error::No NSIS installer found under $SRC"; exit 1
          fi
          test -f "$SETUP.sig" || { echo "::error::$SETUP has no .sig — is TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; }

          BASE=$(basename "${SETUP%.exe}")            # Orcaa_1.4.0_x64-setup
          RENAMED="${BASE%-setup}-win7-setup.exe"     # Orcaa_1.4.0_x64-win7-setup.exe
          OUT="$RUNNER_TEMP/win7"
          mkdir -p "$OUT"
          cp "$SETUP"     "$OUT/$RENAMED"
          cp "$SETUP.sig" "$OUT/$RENAMED.sig"
          cp "$SETUP"     "$OUT/${{ matrix.stable_exe }}"

          gh release upload "$TAG" "$OUT/$RENAMED" "$OUT/$RENAMED.sig" "$OUT/${{ matrix.stable_exe }}" --clobber
          echo "Uploaded $RENAMED (+ .sig) and ${{ matrix.stable_exe }}"

  manifest:
    needs: [resolve, build, build-win7]
    # Runs even when some build jobs failed. Without this a single failing
    # platform job skips this job entirely and the release ships with no
    # latest.json — which makes /releases/latest/download/latest.json 404 for
    # every installed client and silently stops all updates. A partial manifest
    # is far better than none; the step below still errors if the release
    # produced no signed payloads at all.
    if: ${{ !cancelled() }}
    name: Compose updater manifest (${{ matrix.channel }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 10/11 + macOS + Linux installs poll latest.json; the Windows
          # 7 build polls latest-win7.json (its overlay config points there), so
          # a Win7 station is never offered an installer it cannot run.
          - channel: stable
            manifest: latest.json
          - channel: win7
            manifest: latest-win7.json
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.resolve.outputs.version }}
      CHANNEL: ${{ matrix.channel }}
      MANIFEST: ${{ matrix.manifest }}
    steps:
      # Needed only to read CHANGELOG.md for the release notes below.
      - name: Checkout
        uses: actions/checkout@v4

      # Built from the release's own *.sig assets rather than per-runner, so the
      # Windows, macOS and Linux entries always land in ONE manifest regardless
      # of job order or failure.
      - name: Build updater manifest from release signatures
        shell: bash
        run: |
          set -euo pipefail

          TAG="v$VERSION"

          # Release notes come from the CHANGELOG.md section matching this
          # version. The branded update window renders exactly this text to end
          # users — keep entries short, user-readable, no internal jargon.
          # Missing entry -> generic fallback, same behavior as before.
          NOTES=$(awk -v ver="$VERSION" '
            /^## /{ if (found) exit; found = ($2 == ver); next }
            found { print }
          ' CHANGELOG.md 2>/dev/null | sed -e '/^[[:space:]]*$/d' || true)

          if [[ -z "$NOTES" ]]; then
            echo "::warning::No CHANGELOG.md entry for $VERSION — the update window will show the generic fallback text."
            NOTES="Improvements and fixes."
          fi

          ASSETS=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "Release assets for $TAG:"; echo "$ASSETS"

          PLATFORMS="{}"
          add_platform() {
            local key="$1" sig="$2" url="$3"
            PLATFORMS=$(jq -n --argjson p "$PLATFORMS" --arg k "$key" --arg s "$sig" --arg u "$url" \
              '$p + {($k): {signature: $s, url: $u}}')
          }

          fetch_sig() {
            local name="$1"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern "$name" --dir sigs >/dev/null
            tr -d '[:space:]' < "sigs/$name"
          }

          asset_url() {
            printf 'https://github.com/%s/releases/download/%s/%s' \
              "$GITHUB_REPOSITORY" "$TAG" "$(jq -rn --arg n "$1" '$n|@uri')"
          }

          WIN_NSIS=""; WIN_MSI=""
          while IFS= read -r sig_name; do
            [[ -z "$sig_name" ]] && continue
            payload="${sig_name%.sig}"
            signature=$(fetch_sig "$sig_name")
            url=$(asset_url "$payload")

            if [[ "$CHANNEL" == "win7" ]]; then
              # Only the Windows 7 installers belong here. The updater plugin
              # reports `i686` for a 32-bit build, hence the two keys.
              case "$payload" in
                *_x64-win7-setup.exe) add_platform "windows-x86_64" "$signature" "$url" ;;
                *_x86-win7-setup.exe) add_platform "windows-i686"   "$signature" "$url" ;;
                *) ;;
              esac
              continue
            fi

            case "$payload" in
              # The Win7 installers carry the same suffix as the ordinary NSIS
              # one — this arm MUST come first or a re-run could hand a Windows
              # 10/11 station an installer whose WebView2 is pinned at 109.
              *-win7-setup.exe) ;;
              # createUpdaterArtifacts:true signs the installer itself; *.zip covers v1Compatible.
              *-setup.exe|*.nsis.zip)
                WIN_NSIS="$signature|$url" ;;
              *.msi|*.msi.zip)
                WIN_MSI="$signature|$url" ;;
              *.app.tar.gz)
                # Universal binary — the updater looks up an exact `darwin-<arch>` key,
                # so both architectures point at the same artifact.
                add_platform "darwin-aarch64" "$signature" "$url"
                add_platform "darwin-x86_64"  "$signature" "$url" ;;
              *.AppImage|*.AppImage.tar.gz)
                # AppImage is the only self-updating Linux format (.deb/.rpm update via the distro).
                add_platform "linux-x86_64" "$signature" "$url" ;;
              *)
                echo "::notice::Ignoring unrecognized signed asset $payload" ;;
            esac
          done <<< "$(echo "$ASSETS" | grep '\.sig$' || true)"

          if [[ "$CHANNEL" != "win7" ]]; then
            # Existing installs are NSIS (landing-page exe), so prefer the NSIS payload;
            # MSI is only the fallback if NSIS ever disappears from the release.
            WIN="${WIN_NSIS:-$WIN_MSI}"
            if [[ -n "$WIN" ]]; then
              add_platform "windows-x86_64" "${WIN%%|*}" "${WIN#*|}"
            fi
          fi

          COUNT=$(jq 'length' <<< "$PLATFORMS")
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::No updater payloads found on release $TAG for the $CHANNEL channel. Is bundle.createUpdaterArtifacts enabled and TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > "$MANIFEST"

          echo "$MANIFEST:"; cat "$MANIFEST"
          gh release upload "$TAG" "$MANIFEST" -R "$GITHUB_REPOSITORY" --clobber
