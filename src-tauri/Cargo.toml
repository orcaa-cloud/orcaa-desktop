[package]
name = "orcaa-desktop"
version = "1.4.5"
description = "Orcaa desktop wrapper (Business + Admin)"
authors = ["Orcaa"]
edition = "2021"

[lib]
name = "orcaa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Preview switch ONLY — compiles the Windows 7 code paths on a stable
# toolchain so CI's clippy keeps them honest (`cargo clippy --features win7`).
# A shipping Win7 build never passes this flag: build.rs turns the same cfg on
# from the target triple (`*-win7-windows-msvc`), and the WinRT dependencies
# below drop out of the graph by `target_vendor`, which a feature cannot do
# (features are additive; the tauri CLI has no `--no-default-features`).
win7 = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
# `deep-link` feature is required on Windows/Linux: the OS launches a NEW
# process with the orcaa:// URL as a CLI argument instead of signalling the
# running one. This feature forwards that argument into the existing instance
# so `on_open_url` fires there, matching macOS behaviour.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-window-state = "2"
sys-locale = "0.3"
tauri-plugin-log = "2"
log = "0.4"
tokio = { version = "1", features = ["time"] }
tauri-plugin-deep-link = "2"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# POS receipt printing: raw ESC/POS over TCP:9100 or a serial COM port.
# The byte protocol is hand-rolled in print.rs — these are only transport
# (serialport) and text encoding (encoding_rs: cp1256 Arabic / cp437 latin).
serialport = "4"
encoding_rs = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Windows 7 has no toast centre and no `combase.dll`: both crates below bind
# WinRT statically, so a binary that links them fails to LOAD there ("entry
# point not found") before a line of ours runs. The Win7 build (target vendor
# `win7`) therefore leaves them out entirely and notify.rs falls back to a
# taskbar flash + the web app's own in-app banner. `Cargo.lock` is target-
# agnostic, so this changes nothing for the ordinary Windows 10/11 build.
[target.'cfg(not(target_vendor = "win7"))'.dependencies]
tauri-plugin-notification = "2"

[target.'cfg(all(windows, not(target_vendor = "win7")))'.dependencies]
tauri-winrt-notification = "0.7"

[target."cfg(windows)".dependencies]
# Receipt printing over the Windows print spooler in RAW mode — the transport
# every USB-only thermal printer needs (most of them). Only the printing and
# foundation surfaces; the version already resolves in the lock file.
# PRINTER_INFO_2W (the level that carries the DRIVER name, which is what
# identifies a thermal printer) is gated behind the Security + Gdi features.
# `Win32_UI_WindowsAndMessaging` is for `FlashWindowEx`, the Windows 7
# stand-in for a toast (classic user32, present since XP).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

# ---------------------------------------------------------------------------
# Windows 7 lane: `ctor` 0.8.0 (pulled in by tauri-utils for its cached
# starting-binary path) picks the `.CRT$XCU` constructor section only when
# `target_vendor = "pc"`, and hard-errors on anything else — the win7 targets
# report vendor `win7`. `patches/ctor` is a byte-for-byte copy of the crates.io
# 0.8.0 release with that one cfg widened to accept `win7` too (see the README
# there). It resolves to the same version, so the Windows 10/11, macOS and
# Linux builds compile identical code. Drop the patch once tauri-utils moves to
# a ctor release that keys off `target_os = "windows"`.
# ---------------------------------------------------------------------------
[patch.crates-io]
ctor = { path = "patches/ctor" }
