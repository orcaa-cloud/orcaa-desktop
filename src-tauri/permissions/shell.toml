# Permissions for the shell's own commands.
#
# Tauri gates every IPC call from a remote origin, always. It only gates calls
# from *local* pages once the app declares an ACL manifest — and the mere
# existence of this file is that declaration. So once one command is listed here,
# ALL of them must be, including the ones the update window calls from a page the
# shell itself served. A missing entry is a silent runtime rejection, not a build
# error.
#
# Referenced from `capabilities/default.json` (local pages) and
# `capabilities/remote.json` (the hosted PWA). App permissions carry no plugin
# prefix, which is how they are told apart from `core:` and plugin permissions.

[[permission]]
identifier = "allow-shell-signin"
description = """
Lets the shell's own welcome page hand sign-in to the system browser.

Deliberately a command rather than a link the shell intercepts: an invoke can
only come from the page's click handler, so merely *landing* on the welcome
page — which is what a sign-out, an expired session and a cold launch all do —
can no longer open a browser window on its own.
"""
commands.allow = ["signin_start"]

[[permission]]
identifier = "allow-shell-controls"
description = """
Desktop keyboard affordances for the hosted app: reload, fullscreen and quit.

Granted to the remote origin because the script that binds these keys is injected
into the tenant page. (Zoom is deliberately absent: the webview is pinned at
100% — the injected script swallows the zoom keys and Ctrl+wheel outright.)
"""
commands.allow = [
  "shell_reload",
  "shell_fullscreen_toggle",
  "shell_quit",
]

[[permission]]
identifier = "allow-shell-notify"
description = """
Native toasts that can be clicked.

Replaces `plugin:notification|notify` for the hosted app. The plugin's desktop
path drops the notification handle, so its toasts can never be clicked; this one
raises the window and navigates to the page the notification is about, and can
draw an incoming call as a ringing, persistent toast with Answer / Decline.

The `url` it carries is validated against the orcaa hosts on the Rust side
before anything is navigated — this command is reachable from the remote page.
"""
commands.allow = ["shell_notify"]

[[permission]]
identifier = "allow-shell-window"
description = """
The custom titlebar's caption buttons (minimize / maximize / close) plus the
maximized-state read that picks the right glyph.

Needed wherever the OS frame is gone: the web topbar on Windows, and the
shell's own welcome/boot pages. The action set is fixed in Rust and scoped to
the main window, so this grants nothing the native caption buttons didn't do —
close in particular still rides CloseRequested and hides to the tray.
"""
commands.allow = ["shell_window_control", "shell_window_state"]

[[permission]]
identifier = "allow-shell-badge"
description = """
Mirrors the web app's unread notification count onto the taskbar (Windows: a
red-dot overlay) or dock (macOS/Linux: a numeric badge). Zero clears it. The
count is the only input and it draws nothing but the badge.
"""
commands.allow = ["shell_badge"]

[[permission]]
identifier = "allow-shell-pos"
description = """
The POS station: silent ESC/POS receipt printing, cash-drawer kick, printer
config and a test page.

The printer is reached directly (a Windows print queue in RAW mode, TCP:9100
or a serial port) with bytes built in Rust from a semantic op list — the page
never supplies raw device bytes, the drawer only fires when the saved config
allows it, and nothing here can read anything back. Listing the installed
printers returns names and drivers only, so the station can configure itself
instead of asking the shop to type a queue name. Printing is the whole point
of granting this to the hosted POS page.
"""
commands.allow = [
  "shell_pos_print",
  "shell_pos_test_print",
  "shell_pos_printer_get",
  "shell_pos_printer_set",
  "shell_pos_printers_list",
  "shell_pos_printer_autodetect",
  "shell_label_print",
  "shell_label_test_print",
  "shell_label_printer_get",
  "shell_label_printer_set",
  "shell_label_printer_autodetect",
  "shell_label_calibrate",
]

[[permission]]
identifier = "allow-shell-kitchen"
description = """
The kitchen pass: silent KOT printing per station, the station→printer map,
a test ticket, and the raster fallback for thermal printers whose firmware
cannot shape Arabic.

Same trust story as allow-shell-pos — bytes are built in Rust from a semantic
op list (the page never supplies raw device bytes), tickets are hard-stripped
of drawer/QR ops, and nothing reads anything back. Without this grant a fired
round reaches the KDS but no paper comes out at the pass, which is the whole
reason a kitchen runs the desktop shell.
"""
commands.allow = [
  "shell_kot_print",
  "shell_kitchen_test_print",
  "shell_kitchen_printers_get",
  "shell_kitchen_printer_set",
  "shell_kitchen_printer_autodetect",
  "shell_print_raster",
]

[[permission]]
identifier = "allow-autostart-prompt"
description = """
The branded first-run autostart offer's two choices. Local only — the page is
served by the shell in its own frameless window (same chrome as the update
prompt); the hosted app has no business toggling autostart.
"""
commands.allow = ["autostart_accept", "autostart_decline"]

[[permission]]
identifier = "allow-updater-window"
description = """
The three choices the update window offers: install now, remind me later, and
skip this version. Local only — the hosted app has no business installing
binaries.
"""
commands.allow = ["update_install", "update_snooze", "update_skip"]
[[permission]]
identifier = "allow-shell-payments"
description = "Register a checkout return; cannot authenticate or settle payments."
commands.allow = ["shell_payment_register"]
